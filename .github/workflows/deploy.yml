name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Create firebase.js
        run: |
          cat > src/firebase.js << 'EOF'
          import { initializeApp } from "firebase/app";
          import { getAuth } from "firebase/auth";
          import { getFirestore } from "firebase/firestore";
          import { getStorage } from "firebase/storage";

          const firebaseConfig = {
            apiKey: "AIzaSyBqfCaRoJevCY0m9AVO9rjSzCYlgv6lhJM",
            authDomain: "kitobxona-99c8d.firebaseapp.com",
            projectId: "kitobxona-99c8d",
            storageBucket: "kitobxona-99c8d.firebasestorage.app",
            messagingSenderId: "583553812710",
            appId: "1:583553812710:web:c97d0fe8b473572813d327",
            measurementId: "G-9C4GCV5NJC"
          };

          const app = initializeApp(firebaseConfig);
          export const auth = getAuth(app);
          export const db = getFirestore(app);
          export const storage = getStorage(app);
          export default app;
          EOF

      - name: Build project
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: kitobxona-99c8d
